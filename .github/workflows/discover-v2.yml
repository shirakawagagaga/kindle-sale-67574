name: discover-kindle-sale-v2
on:
  push:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sale pages
        run: |
          python - <<'PY'
          import requests,json,html
          urls=[
            "https://kintyaku.net/sale",
            "https://kintyaku.net/sale/osusume",
            "https://yapi.ta2o.net/kndlsl/pickup/",
          ]
          out={}
          for u in urls:
            try:
              r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=45)
              item={"status":r.status_code,"len":len(r.text),"final":r.url}
              if r.ok:
                hits=[]
                for needle in ["秋の特別セール","9月25日","10月8日","67574"]:
                  start=0
                  while True:
                    p=r.text.find(needle,start)
                    if p<0:
                      break
                    hits.append({"needle":needle,"context":r.text[max(0,p-1500):p+3500]})
                    start=p+len(needle)
                    if len(hits)>=30:
                      break
                item["hits"]=hits
              out[u]=item
            except Exception as e:
              out[u]={"error":repr(e)}
          open("diagnostic-v2.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add diagnostic-v2.json
          git diff --cached --quiet || git commit -m "Refresh sale discovery diagnostic"
          git push
