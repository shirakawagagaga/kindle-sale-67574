name: discover-kindle-sale-v2
on:
  push:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sale pages
        run: |
          python - <<'PY'
          import requests,json,html,re
          urls=[
            "https://r.jina.ai/http://kintyaku.net/sale",
            "https://r.jina.ai/https://kintyaku.net/sale",
            "https://r.jina.ai/https://kintyaku.net/sale?page=2",
            "https://r.jina.ai/https://kintyaku.net/sale?p=2",
            "https://r.jina.ai/https://kintyaku.net/sale?paged=2",
            "https://r.jina.ai/https://kintyaku.net/sale/2",
            "https://r.jina.ai/https://kintyaku.net/sale/page/2",
            "https://r.jina.ai/https://kintyaku.net/sale?page=3",
            "https://r.jina.ai/https://kintyaku.net/sale/3",
            "https://r.jina.ai/https://kintyaku.net/sale/page/3",
            "https://r.jina.ai/https://kintyaku.net/sale/page/4",
            "https://r.jina.ai/https://kintyaku.net/sale/page/5",
            "https://r.jina.ai/http://kintyaku.net/sale/osusume",
            "https://r.jina.ai/https://kintyaku.net/sale",
            "https://yapi.ta2o.net/kndlsl/pickup/",
            "https://kinpome.com/kindle-sale2/",
            "https://r.jina.ai/https://kinpome.com/kindle-sale2/",
          ]
          out={}
          for u in urls:
            try:
              r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=45)
              item={"status":r.status_code,"len":len(r.text),"final":r.url}
              m=re.search(r"一覧は軽量化のため分割表示しています[^\n]{0,120}",r.text)
              if m: item["page_marker"]=m.group(0)
              if "kinpome.com" in u:
                import re
                item["scripts"]=re.findall(r"<script[^>]+src=[\'\"]([^\'\"]+)",r.text,re.I)
                item["hrefs"]=re.findall(r"href=[\'\"]([^\'\"]+)",r.text,re.I)[:3000]
                item["api_refs"]=re.findall(r".{0,150}(?:ajax|api|json|graphql|wp-json).{0,300}",r.text,re.I)[:100]

              if r.ok:
                hits=[]
                for needle in ["秋の特別セール","9月25日","10月8日","67574"]:
                  start=0
                  while True:
                    p=r.text.find(needle,start)
                    if p<0:
                      break
                    hits.append({"needle":needle,"context":r.text[max(0,p-1500):p+3500]})
                    start=p+len(needle)
                    if len(hits)>=30:
                      break
                item["hits"]=hits
              if "r.jina.ai/https://kinpome.com" in u or "r.jina.ai/https://kintyaku.net" in u:
                item["body_head"]=r.text[:20000]
                item["body_tail"]=r.text[-12000:]
                item["next_contexts"]=[]
                pos=0
                while True:
                  p=r.text.find("次へ",pos)
                  if p<0: break
                  item["next_contexts"].append(r.text[max(0,p-1000):p+1500])
                  pos=p+2
                  if len(item["next_contexts"])>=10: break
                item["autumn_contexts"]=[]
                for needle in ["秋の特別セール","67574","75%OFF","9月25","10月8"]:
                  pos=0
                  while True:
                    p=r.text.find(needle,pos)
                    if p<0: break
                    item["autumn_contexts"].append(r.text[max(0,p-2500):p+5000])
                    pos=p+len(needle)
                    if len(item["autumn_contexts"])>=20: break
                item["sale_links"]=re.findall(r"https://kintyaku\\.net/sale/[^\\s)\\]]+",r.text)
                item["page_links"]=re.findall(r"https://kintyaku\\.net/[^\\s)\\]]*(?:page|p=[^\\s)\\]]*)[^\\s)\\]]*",r.text)[:200]

              out[u]=item
            except Exception as e:
              out[u]={"error":repr(e)}
          open("diagnostic-v2.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Probe dedicated 2026-09-25 sale pages
        run: |
          # Probe 9/25 dedicated sale IDs to locate the Autumn Special Sale page
          seq -w 1 46 | xargs -P 8 -I{} sh -c '
            u="https://r.jina.ai/https://kintyaku.net/sale/p202609-25-{}"
            title=$(curl -L --max-time 20 -s "$u" | grep -m1 "^Title:" || true)
            printf "%s\\t%s\\n" "{}" "$title"
          ' | sort -n > september25_titles.txt
      - name: Search Kintyaku sitemap for Autumn sale
        run: |
          for u in https://r.jina.ai/https://kintyaku.net/sitemap.xml https://r.jina.ai/https://kintyaku.net/wp-sitemap.xml https://r.jina.ai/https://kintyaku.net/wp-sitemap-posts-sale-1.xml https://r.jina.ai/https://kintyaku.net/sitemap_index.xml; do
            name=$(echo "$u" | sed 's#[^A-Za-z0-9]#_#g')
            curl -L --max-time 45 -s "$u" > "sitemap_$name.txt" || true
          done
          grep -R -l -E "秋の特別セール|p202609-25|20260925" sitemap_*.txt > kintyaku_sitemap_hits.txt || true
      - name: Extract Autumn page from Kinseri sales index
        run: |
          python - <<'PY'
          import requests,re
          u="https://yapi.ta2o.net/kndlsl/sales/"
          r=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=60)
          s=r.text
          hits=[]
          for needle in ["秋の特別セール","6万冊以上","75%オフ"]:
            pos=0
            while True:
              i=s.find(needle,pos)
              if i<0: break
              hits.append(s[max(0,i-5000):i+8000])
              pos=i+len(needle)
              if len(hits)>=20: break
          open("kinseri_sales_index.txt","w",encoding="utf-8").write(s)
          open("kinseri_autumn_index_context.txt","w",encoding="utf-8").write("\n\n---\n\n".join(hits))
          urls=re.findall(r'href=["\\\']([^"\\\']+)["\\\'][^>]*>[^<]*(?:秋の特別セール|6万冊以上|75%オフ)',s,re.I|re.S)
          open("kinseri_autumn_urls.txt","w",encoding="utf-8").write("\n".join(urls))
          print("status",r.status_code,"len",len(s),"hits",len(hits),"urls",urls[:20])
          PY
      - name: Probe Kinseri current pickup through reader
        run: |
          u="https://r.jina.ai/https://yapi.ta2o.net/kndlsl/pickup/"
          curl -L --max-time 60 -s "$u" > kinseri_reader.txt || true
          python - <<'PY'
          p=open("kinseri_reader.txt",encoding="utf-8",errors="ignore").read()
          out=[]
          for needle in ["秋の特別セール","6万冊以上","64418"]:
            pos=0
            while True:
              i=p.find(needle,pos)
              if i<0: break
              out.append(p[max(0,i-3000):i+5000])
              pos=i+len(needle)
              if len(out)>=20: break
          open("kinseri_autumn_context.txt","w",encoding="utf-8").write("\n\n---\n\n".join(out))
          PY
      - name: Inspect candidate Amazon node responses
        run: |
          for node in 22273253051 22273253011 22273253001 22273253151 22273253251 22273253351; do
            curl -L --max-time 20 -s -A "Mozilla/5.0" "https://www.amazon.co.jp/b/?node=$node" > "amazon_$node.html" || true
          done
      - name: Probe Amazon sale node candidates
        run: |
          : > amazon_node_probe.txt
          for node in 22273253051 22273253011 22273253001 22273253151 22273253251 22273253351; do
            u="https://www.amazon.co.jp/b/?node=$node"
            body=$(curl -L --max-time 20 -s -A "Mozilla/5.0" "$u" || true)
            printf "%s\\t%s\\t%s\\n" "$node" "$(printf "%s" "$body" | grep -o -m1 "<title>[^<]*" | sed "s/<title>//")" "$(printf "%s" "$body" | wc -c)" >> amazon_node_probe.txt
          done
      - name: Probe Amazon node via reader
        run: |
          u="https://r.jina.ai/https://www.amazon.co.jp/s?i=digital-text&bbn=22273253051"
          curl -L --max-time 60 -s "$u" > amazon_reader.txt || true
          head -c 30000 amazon_reader.txt > amazon_reader_head.txt
      - name: Commit diagnostic
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add diagnostic-v2.json september25_titles.txt amazon_node_probe.txt amazon_reader.txt amazon_reader_head.txt kinseri_reader.txt kinseri_autumn_context.txt kinseri_sales_index.txt kinseri_autumn_index_context.txt kinseri_autumn_urls.txt amazon_*.html sitemap_*.txt kintyaku_sitemap_hits.txt 2>/dev/null || git add diagnostic-v2.json
          git diff --cached --quiet || git commit -m "Refresh sale discovery diagnostic"
          git push
