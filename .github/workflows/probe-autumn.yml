name: collect-autumn-corpus
on:
  push:
    paths:
      - '.github/workflows/probe-autumn.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os, requests, re, json, time
          shard=int(os.environ["SHARD"])
          start=shard*29+1
          end=min(226,start+28)
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36"})
          rows=[]
          all_asins=set()
          for n in range(start,end+1):
              url=f"https://r.jina.ai/http://kintyaku.net/sale/p202609-25-{n}"
              ok=False
              for attempt in range(4):
                  try:
                      rr=session.get(url,timeout=90)
                      txt=rr.text
                      asins=set(re.findall(r'(?:https?://)?(?:www\\.)?amazon\\.co\\.jp/dp/([A-Z0-9]{10})',txt))
                      if rr.status_code==200 and asins:
                          rows.append({"page":n,"status":rr.status_code,"chars":len(txt),"asins":sorted(asins)})
                          all_asins.update(asins)
                          ok=True
                          break
                      rows.append({"page":n,"status":rr.status_code,"chars":len(txt),"asins":sorted(asins),"attempt":attempt+1})
                  except Exception as e:
                      if attempt==3:
                          rows.append({"page":n,"error":repr(e),"attempt":attempt+1})
                  time.sleep(2*(attempt+1))
              time.sleep(1.5)
          os.makedirs("shards",exist_ok=True)
          json.dump({"shard":shard,"start":start,"end":end,"pages":rows,"unique_asins":sorted(all_asins)},
                    open(f"shards/shard-{shard}.json","w",encoding="utf-8"),ensure_ascii=False)
          print("SHARD",shard,"pages",start,end,"unique",len(all_asins))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autumn-shard-${{ matrix.shard }}
          path: shards/shard-${{ matrix.shard }}.json
          retention-days: 7

  merge:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: autumn-shard-*
          path: shards
          merge-multiple: false
      - name: Merge and verify
        run: |
          python - <<'PY'
          import glob,json,re,os
          by_page={}
          all_asins=set()
          errors=[]
          for f in glob.glob("shards/**/shard-*.json",recursive=True):
              d=json.load(open(f,encoding="utf-8"))
              for p in d["pages"]:
                  by_page[p["page"]]=p
                  all_asins.update(p.get("asins",[]))
                  if "error" in p: errors.append(p)
          pages_ok=sum(1 for p in by_page.values() if p.get("asins"))
          expected=67574
          out={"expected":expected,"unique_asins":len(all_asins),"pages_seen":len(by_page),
               "pages_with_asins":pages_ok,"pages_missing_or_failed":[n for n in range(1,227) if not by_page.get(n,{}).get("asins")],
               "errors":errors,"asins":sorted(all_asins)}
          json.dump(out,open("autumn_asins_merged.json","w",encoding="utf-8"),ensure_ascii=False)
          print("UNIQUE_ASINS",len(all_asins),"PAGES_OK",pages_ok,"PAGES_TOTAL",len(by_page))
          if len(all_asins)!=expected:
              print("CORPUS_NOT_COMPLETE")
          else:
              print("CORPUS_COMPLETE_67574")
          PY
      - name: Commit merged corpus
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add autumn_asins_merged.json
          git diff --cached --quiet || git commit -m "Collect full Autumn sale ASIN corpus"
          git push
